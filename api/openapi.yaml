openapi: 3.1.0

info:
  title: sandbox-svc
  version: 1.0.0
  description: |
    sandbox-svc — the favorite-items feature (FEAT-001), the CSV export
    (FEAT-003), and the favorites summary (FEAT-005).

    Five routes: favorite an item, list your favorites, un-favorite one,
    summarize your favorites, and export them as a CSV download. Every route
    acts on the calling user's own rows only; the user is taken from the access
    token, never from the request, so no route accepts a user id.

    Paths, methods and tags for the four JSON routes are emitted by
    nexcommon's own generator (`GenerateSwaggerDocs`, served at
    `/swagger/swagger.yaml`), so they cannot drift from the routes the service
    registers. `GET /v1/favorites/export` is the exception: it is registered
    directly on the mux router, because the response is a file with its own
    headers rather than the JSON envelope, so the generator cannot see it and
    this document is its only contract. The response side of every route — the
    `{success, header, payload}` envelope, the per-status coverage, the
    business error codes, and examples taken from the real DTOs — is authored
    here for the same reason.

servers:
  - url: http://localhost:{port}
    description: Local compose stack
    variables:
      port:
        default: "8080"

# One tag per entity, matching the code's own organization: every route in
# `services/favorite/` carries `constanta.TagFavorite`, and the tag is what
# postman-collection-generator's folderStrategy=Tags groups the collection by.
tags:
  - name: Favorite
    description: The calling user's personal favorites list (`services/favorite/`).

security:
  - bearerAuth: []

paths:
  /v1/favorites:
    post:
      tags: [Favorite]
      operationId: addFavorite
      summary: Favorite an item
      description: |
        Adds an item to the calling user's favorites. Favoriting an item that is
        already favorited succeeds and changes nothing (`already_favorited:
        true`). Fails with 422 when the user already holds 500 favorites —
        nothing is inserted and no existing favorite is evicted. Answers 404
        when the item does not exist in the catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFavoriteRequest'
            examples:
              add:
                value:
                  item_id: 1
      responses:
        '200':
          description: The item is now in the caller's favorites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddFavoriteResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/Internal'

    get:
      tags: [Favorite]
      operationId: listFavorites
      summary: List the calling user's favorites
      description: |
        Returns everything the calling user has favorited, most recently
        favorited first. An item discontinued in the catalog after it was
        favorited is still listed, with `available: false` — the availability
        flag is read live from the catalog, not copied at favorite-time.

        An empty list is a normal response: `favorites` is `[]`, never `null`.

        Taking no sort or filter parameters is deliberate for this pass;
        `created_at` is retained so a later pass can add them without a
        migration.
      responses:
        '200':
          description: The caller's favorites, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListEnvelope'
              examples:
                empty:
                  value:
                    success: true
                    header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                    payload: { favorites: [] }
                one:
                  value:
                    success: true
                    header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                    payload:
                      favorites:
                        - item_id: 1
                          name: "Item 1"
                          available: true
                          favorited_at: "2026-10-11T00:00:00.000000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/favorites/summary:
    get:
      tags: [Favorite]
      operationId: getFavoritesSummary
      summary: Summarize the calling user's favorites
      description: |
        Returns how many favorites the calling user owns (`total`) and how many
        of those items are currently unavailable in the catalog
        (`discontinued`). `total` counts every owned row, discontinued or not;
        `discontinued` is a subset of it, so `0 <= discontinued <= total`.

        Both values are derived at request time — nothing is stored or cached —
        and availability is read live from the catalog, so an item discontinued
        after it was favorited changes the next response with no change to any
        favorite row.

        The route takes no parameters and no body; the user is the token's,
        which makes the counts impossible to widen or override from the request.
        Zero favorites is a valid `200` with both values `0`.

        Unlike the FEAT-004 badge, the API never applies a `99+` cap: 100
        favorites is `total: 100`.
      responses:
        '200':
          description: The caller's favorite totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteSummaryEnvelope'
              examples:
                mixed:
                  value:
                    success: true
                    header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                    payload: { total: 5, discontinued: 1 }
                empty:
                  value:
                    success: true
                    header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                    payload: { total: 0, discontinued: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/favorites/export:
    get:
      tags: [Favorite]
      operationId: exportFavorites
      summary: Export the calling user's favorites as CSV
      description: |
        Returns the calling user's current favorites as a downloadable CSV
        attachment. Read-only, and scoped by construction to the auth context's
        user id: no query parameter, path parameter, body field or header can
        select another user, and `?user_id=` / `X-User-Id` are simply unbound.

        The file is UTF-8 with a BOM, uses CRLF record terminators, a comma
        delimiter and RFC 4180 quoting (a field containing a comma, double
        quote, CR or LF is quoted, and embedded quotes are doubled). The header
        row is exactly `item_id,name,category,price,available,favorited_at,note`.
        `price` is a raw number with no currency symbol, grouping or rounding;
        `available` is `Tersedia` or `Tidak Tersedia`; `favorited_at` is the
        UTC date as `YYYY-MM-DD`; an absent or empty note is an empty cell. Any
        `name`, `category` or `note` beginning with `=`, `+`, `-` or `@` is
        prefixed with an apostrophe so a spreadsheet cannot execute it as a
        formula.

        There is no paging and no filtering: every favorite is included,
        newest-favorited first, in the same order as `GET /v1/favorites`. Zero
        favorites is a valid `200` with a header-only file, never an error.

        This route is registered directly on the mux router rather than through
        nexcommon's generator, so it does not appear in `/swagger/swagger.yaml`;
        this document is its contract.
      responses:
        '200':
          description: The caller's favorites as a CSV file (header-only when empty).
          headers:
            Content-Disposition:
              description: A quoted attachment filename with the caller's user id and the UTC export date.
              schema:
                type: string
              example: 'attachment; filename="favorites-1-2026-11-05.csv"'
            Cache-Control:
              description: Always `no-store` — the body is one user's personal data.
              schema:
                type: string
              example: no-store
          content:
            text/csv:
              schema:
                type: string
                format: binary
              examples:
                one_favorite:
                  summary: BOM + header + one row (CRLF line endings)
                  value: |
                    ﻿item_id,name,category,price,available,favorited_at,note
                    1,Notebook,Office,19.99,Tersedia,2026-04-09,Buy more
                empty:
                  summary: A user with no favorites — header only
                  value: |
                    ﻿item_id,name,category,price,available,favorited_at,note
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/favorites/{item_id}:
    delete:
      tags: [Favorite]
      operationId: removeFavorite
      summary: Un-favorite an item
      description: |
        Removes the item from the calling user's favorites.

        Answers 404 both when the item was never favorited and when the row
        belongs to another user — the two are deliberately indistinguishable, so
        this endpoint cannot be used to enumerate other users' favorites. A path
        segment that is not a positive integer takes the same 404.
      parameters:
        - name: item_id
          in: path
          required: true
          description: The catalog item's id.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The item is no longer in the caller's favorites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveFavoriteResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      # Modelled as apiKey-in-header rather than http/bearer on purpose.
      # UserAccessValidator uses the *raw* Authorization value as a Redis key —
      # it is not a JWT and is never parsed. Postman's http/bearer helper
      # prepends "Bearer ", which would look up the wrong key and 401 every
      # request; apiKey sends the value verbatim, which is what the server
      # actually expects.
      type: apiKey
      in: header
      name: Authorization
      description: |
        An opaque access token, sent verbatim in the `Authorization` header (no
        `Bearer ` prefix). nexcommon's `UserAccessValidator` resolves the
        caller's identity by looking the raw value up in Redis.

  responses:
    BadRequest:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            empty_item_id:
              value:
                success: false
                header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                payload: { status: 400, code: "E-4-CMD-DTO-001", message: "ITEM_ID Cannot Empty" }
    Unauthorized:
      description: No valid access token was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: |
        For DELETE — no favorite of the caller's matches (never favorited, or
        belongs to another user; the caller cannot tell which).
        For POST — the item does not exist in the catalog.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            favorite_not_found:
              value:
                success: false
                header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                payload: { status: 404, code: "FAVORITE_NOT_FOUND", message: "Favorite not found" }
            catalog_item_not_found:
              value:
                success: false
                header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                payload: { status: 404, code: "CATALOG_ITEM_NOT_FOUND", message: "Item not found" }
    Unprocessable:
      description: The user already holds the maximum number of favorites.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            at_cap:
              value:
                success: false
                header: { request_id: "b1e3", version: "1.0.0", timestamp: "2026-10-11T00:00:00.000000Z" }
                payload:
                  status: 422
                  code: "FAVORITES_LIMIT_REACHED"
                  message: "You have reached the maximum of 500 favorites. Remove one before adding another."
    Internal:
      description: An unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    AddFavoriteRequest:
      type: object
      required: [item_id]
      properties:
        item_id:
          type: integer
          format: int64
          minimum: 1
          description: The catalog item to favorite.

    AddFavoriteResponse:
      type: object
      required: [item_id, already_favorited]
      properties:
        item_id:
          type: integer
          format: int64
        already_favorited:
          type: boolean
          description: True when the item was already in the list and nothing changed.

    RemoveFavoriteResponse:
      type: object
      required: [item_id]
      properties:
        item_id:
          type: integer
          format: int64

    FavoriteItem:
      type: object
      required: [item_id, name, available, favorited_at]
      properties:
        item_id:
          type: integer
          format: int64
        name:
          type: string
          description: The item's current catalog name, read at list-time.
        available:
          type: boolean
          description: False when the item has been discontinued since it was favorited.
        favorited_at:
          type: string
          format: date-time

    FavoriteSummary:
      type: object
      required: [total, discontinued]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Every favorite the caller owns, including items discontinued since
            they were favorited. Never capped at the badge's `99+`.
        discontinued:
          type: integer
          format: int64
          minimum: 0
          description: The subset of `total` whose catalog item is currently unavailable.

    FavoriteList:
      type: object
      required: [favorites]
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteItem'
          description: Always an array — an empty favorites list is `[]`, never `null`.

    Header:
      type: object
      required: [request_id, version, timestamp]
      properties:
        request_id:
          type: string
        version:
          type: string
        timestamp:
          type: string

    AddFavoriteResponseEnvelope:
      type: object
      required: [success, header, payload]
      properties:
        success:
          type: boolean
          const: true
        header:
          $ref: '#/components/schemas/Header'
        payload:
          $ref: '#/components/schemas/AddFavoriteResponse'

    RemoveFavoriteResponseEnvelope:
      type: object
      required: [success, header, payload]
      properties:
        success:
          type: boolean
          const: true
        header:
          $ref: '#/components/schemas/Header'
        payload:
          $ref: '#/components/schemas/RemoveFavoriteResponse'

    FavoriteSummaryEnvelope:
      type: object
      required: [success, header, payload]
      properties:
        success:
          type: boolean
          const: true
        header:
          $ref: '#/components/schemas/Header'
        payload:
          $ref: '#/components/schemas/FavoriteSummary'

    FavoriteListEnvelope:
      type: object
      required: [success, header, payload]
      properties:
        success:
          type: boolean
          const: true
        header:
          $ref: '#/components/schemas/Header'
        payload:
          $ref: '#/components/schemas/FavoriteList'

    ErrorEnvelope:
      type: object
      required: [success, header, payload]
      properties:
        success:
          type: boolean
          const: false
        header:
          $ref: '#/components/schemas/Header'
        payload:
          $ref: '#/components/schemas/ErrorPayload'

    ErrorPayload:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
          description: The HTTP status, repeated in the body.
        code:
          type: string
          description: A stable business error code, e.g. `FAVORITES_LIMIT_REACHED`.
        message:
          type: string
