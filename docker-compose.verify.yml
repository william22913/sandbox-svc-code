# Verification overlay — used by the nexai runner, never shipped.
#
# Merged over docker-compose.yml for one Newman run. It exists only to make the
# stack fit the runner's ~1.2 GB budget and to seed a deterministic fixture the
# CSV assertions can be exact against:
#
#   postgres    256M   (default shared_buffers alone is 128M)
#   redis        64M
#   app         384M
#   seeds    32M x 2
#   -----------------
#   total       768M
#
# The seed services are not one-shots. `docker compose up --wait` treats a
# container that exits as a failure, so each applies its fixture and then stays
# alive with a healthcheck on /seed.done — healthy means "fixture applied",
# which is exactly when Newman may start.

services:
  postgres:
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=40

  redis:
    mem_limit: 64m
    # No persistence: the fixture is re-seeded on every run.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru

  app:
    mem_limit: 384m

  postgres-seed:
    image: postgres:16-alpine
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sandbox_svc
    volumes:
      - ./tests/live/postgres-seed.sql:/seed/1_live_seed.sql:ro
      - ./tests/live/postgres-seed.sh:/seed.sh:ro
    command: ["sh", "/seed.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /seed.done"]
      interval: 2s
      timeout: 2s
      retries: 90
      start_period: 5s

  redis-seed:
    image: redis:7-alpine
    mem_limit: 32m
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    volumes:
      - ./tests/live/redis-seed.sh:/seed.sh:ro
    command: ["sh", "/seed.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /seed.done"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
